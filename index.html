<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gamepad Overlay</title>

<style>
body {
    margin: 0;
    background: transparent;
    overflow: hidden;
}

/* Layout */
#container {
    position: absolute;
    left: 50px;
    top: 50px;
    font-family: Arial;
}

/* Buttons allgemein */
.btn {
    width: 50px;
    height: 50px;
    margin: 5px;
    display: inline-block;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
    opacity: 0.3;
}

/* aktiv */
.active {
    opacity: 1;
    background: rgba(0,255,0,0.6);
}

/* D-Pad Layout */
#dpad {
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px 50px;
}

/* A / X */
#buttons {
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="container">

    <!-- D-Pad -->
    <div id="dpad">
        <div></div>
        <div class="btn" id="up"></div>
        <div></div>

        <div class="btn" id="left"></div>
        <div></div>
        <div class="btn" id="right"></div>

        <div></div>
        <div class="btn" id="down"></div>
        <div></div>
    </div>

    <!-- A / X -->
    <div id="buttons">
        <div class="btn" id="a">A</div>
        <div class="btn" id="x">X</div>
    </div>

</div>

<script>
function update() {
    const pads = navigator.getGamepads();

    if (!pads[0]) return;

    const gp = pads[0];

    // D-Pad (Standard Xbox Mapping)
    set("up", gp.buttons[12]?.pressed);
    set("down", gp.buttons[13]?.pressed);
    set("left", gp.buttons[14]?.pressed);
    set("right", gp.buttons[15]?.pressed);

    // A / X
    set("a", gp.buttons[0]?.pressed);
    set("x", gp.buttons[2]?.pressed);

    requestAnimationFrame(update);
}

function set(id, active) {
    const el = document.getElementById(id);
    if (!el) return;

    if (active) {
        el.classList.add("active");
    } else {
        el.classList.remove("active");
    }
}

update();
</script>

</body>
</html>
